# Server Port
server.port=8080

# Application Details
spring.application.name=portfolio-backend

# In-Memory Database (Default for quick testing)
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate & JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Database Templates (MySQL / PostgreSQL)
# ==========================================
# To use MySQL or PostgreSQL, uncomment the corresponding section below and comment out the H2 section above.

